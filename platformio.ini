[platformio]
default_envs = t-hmi
; To switch active demo, change src_dir below:
; src_dir = demos/01_touch_draw
; src_dir = demos/02_komoot_tours
src_dir = src

[env:t-hmi]
platform = espressif32
board = esp32s3box
framework = arduino
upload_speed = 460800
monitor_speed = 115200
upload_protocol = esptool
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
